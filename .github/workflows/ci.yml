name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    runs-on: ${{ fromJSON((github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '["self-hosted", "Linux", "X64", "homelab"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test SDK cache helper
        timeout-minutes: 2
        shell: bash
        run: bash .github/scripts/test-flutter-cache.sh

      - uses: subosito/flutter-action@v2
        if: runner.environment != 'self-hosted'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Set up persistent Flutter cache
        if: runner.environment == 'self-hosted'
        timeout-minutes: 150
        shell: bash
        run: bash .github/scripts/setup-flutter-cache.sh

      - run: flutter pub get
        timeout-minutes: 10

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        timeout-minutes: 10
        run: flutter analyze

      - name: Test
        timeout-minutes: 20
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true


  build_desktop:
    if: github.event_name == 'push'
    needs: analyze_and_test
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: '["self-hosted", "Linux", "X64", "homelab"]'
          - target: macos
            runner: '["macos-latest"]'
          - target: windows
            runner: '["windows-latest"]'

    runs-on: ${{ fromJSON(matrix.runner) }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        if: runner.environment != 'self-hosted'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Set up persistent Flutter cache
        if: runner.environment == 'self-hosted'
        timeout-minutes: 15
        shell: bash
        run: bash .github/scripts/setup-flutter-cache.sh

      - run: flutter pub get

      - name: Enable ${{ matrix.target }} desktop
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Build (${{ matrix.target }})
        run: flutter build ${{ matrix.target }} --release


  auto_merge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false

    needs:
      - analyze_and_test

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Squash-merge after required validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
