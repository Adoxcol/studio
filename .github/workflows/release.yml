name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      WINDOWS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
      WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Build Windows
        run: flutter build windows --release --build-name $env:RELEASE_VERSION --dart-define=STUDIO_VERSION=$env:RELEASE_VERSION
      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk
      - name: Package Windows
        shell: pwsh
        run: .\tool\package_windows.ps1 -Version $env:RELEASE_VERSION -Output dist\windows
      - name: Sign and verify Windows binaries
        if: ${{ vars.WINDOWS_SIGNTOOL_PATH != '' && vars.WINDOWS_SIGN_TIMESTAMP_URL != '' && secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: .\tool\sign_windows.ps1 -Path dist\windows
      - name: Report unsigned Windows build
        if: ${{ vars.WINDOWS_SIGNTOOL_PATH == '' || vars.WINDOWS_SIGN_TIMESTAMP_URL == '' || secrets.WINDOWS_SIGN_CERT_BASE64 == '' || secrets.WINDOWS_SIGN_CERT_PASSWORD == '' }}
        shell: pwsh
        run: Write-Warning 'Windows signing secrets are not configured; publishing an unsigned installer.'
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows-velopack
          path: dist/windows/*

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/studio-macos.zip" studio.app
      - uses: actions/upload-artifact@v4
        with:
          name: studio-macos
          path: studio-macos.zip

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -y && sudo apt-get install -y libkeybinder-3.0-dev libayatana-appindicator3-dev libgtk-3-dev libblkid-dev liblzma-dev ninja-build cmake pkg-config
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - run: cd build/linux/x64/release/bundle && tar -czf "$GITHUB_WORKSPACE/studio-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux
          path: studio-linux-x64.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/RELEASES
            **/*.nupkg
            **/*.json
            **/*.exe
            studio-macos.zip
            studio-linux-x64.tar.gz
