name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      # Fails the release up front when CHANGELOG.md has no section for it.
      - name: Release notes from CHANGELOG.md
        run: dart tool/release_notes.dart "${{ github.ref_name }}" release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio-release-notes
          path: release-notes.md
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      WINDOWS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
      WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Build Windows
        run: flutter build windows --release --build-name $env:RELEASE_VERSION --dart-define=STUDIO_VERSION=$env:RELEASE_VERSION --dart-define=STUDIO_LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=STUDIO_LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}
      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk
      - name: Package Windows
        shell: pwsh
        run: .\tool\package_windows.ps1 -Version $env:RELEASE_VERSION -Output dist\windows
      - name: Sign and verify Windows binaries
        shell: pwsh
        run: .\tool\sign_windows.ps1 -Path dist\windows
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows-velopack
          path: dist/windows/*

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release --dart-define=STUDIO_LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=STUDIO_LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}
      - run: cd build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/studio-macos.zip" studio.app
      - uses: actions/upload-artifact@v4
        with:
          name: studio-macos
          path: studio-macos.zip

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -y && sudo apt-get install -y libkeybinder-3.0-dev libayatana-appindicator3-dev libgtk-3-dev libblkid-dev liblzma-dev ninja-build cmake pkg-config
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release --dart-define=STUDIO_LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=STUDIO_LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}
      - run: cd build/linux/x64/release/bundle && tar -czf "$GITHUB_WORKSPACE/studio-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: studio-linux
          path: studio-linux-x64.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep build outputs apart from the checkout: globs over the workspace
      # also matched repo files (package.json, Contents.json) and attached
      # them to the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The CHANGELOG.md section, followed by GitHub's list of merged PRs.
          body_path: release-assets/release-notes.md
          generate_release_notes: true
          files: |
            release-assets/**/RELEASES
            release-assets/**/*.nupkg
            release-assets/**/*.json
            release-assets/**/*.exe
            release-assets/studio-macos.zip
            release-assets/studio-linux-x64.tar.gz
