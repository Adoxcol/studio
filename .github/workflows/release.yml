name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    # The registered homelab runner is Linux, not a Windows build host.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter pub get
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip Windows build
        shell: pwsh
        run: |
          $src = if (Test-Path 'build\windows\x64\runner\Release') {
            'build\windows\x64\runner\Release'
          } else {
            'build\windows\runner\Release'
          }
          Compress-Archive -Path "$src\*" -DestinationPath studio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows-x64
          path: studio-windows-x64.zip

  release:
    needs: windows
    runs-on: [self-hosted, Linux, X64, homelab]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studio-windows-x64
          # Never pick up an artifact left by a previous run on this host.
          path: ${{ runner.temp }}/studio-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/studio-release-${{ github.run_id }}-${{ github.run_attempt }}/studio-windows-x64.zip
          body: |
            Windows x64.

            Unzip `studio-windows-x64.zip` and run `studio.exe`. Keep the `data`
            folder and DLLs next to the exe. Windows may warn because the
            build is unsigned.
