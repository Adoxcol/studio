name: media_kit_libs_windows_video
description: Checksum-pinned Windows native libraries for Studio's media_kit player.
version: 1.0.11+studio.1
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitLibsWindowsVideoPluginCApi
